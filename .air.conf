# [Air](https://github.com/cosmtrek/air) TOML config file

# working directory
# use . or absolute path; tmp_dir must be under root
root = "."
tmp_dir = "tmp"

[build]
# shell command used to build; you can use `make` instead
# Windows example: cmd = "go build -o ./tmp/main.exe ."
cmd = "go build -o ./tmp/main ."
# binary produced by cmd
# Windows example: bin = "tmp/main.exe"
bin = "tmp/main"
# command to run the binary; e.g. GIN_MODE=release
# Windows example: full_bin = "./tmp/main.exe"
full_bin = "APP_ENV=dev APP_USER=air ./tmp/main"
# watch these file extensions
include_ext = ["go", "tpl", "tmpl", "html"]
# ignore these dirs/extensions
exclude_dir = ["assets", "tmp", "vendor", "frontend/node_modules"]
# watch these directories
include_dir = []
# exclude these files
exclude_file = []
# delay before rebuild when files change frequently
delay = 1000 # ms
# stop old binary on build error
stop_on_error = true
# air log file under tmp_dir
log = "air_errors.log"

[log]
# show log timestamps
time = true

[color]
# colors per section; falls back to default log if unknown
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# remove tmp dir on exit
clean_on_exit = true