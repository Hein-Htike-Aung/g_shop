definitions:
  app.Response:
    properties:
      data:
        type: object
      msg:
        type: string
      status:
        type: integer
    type: object
info:
  contact: {}
  description: yshop gin mall admin API
  license:
    name: apache2
  termsOfService: https://github.com/guchengwuyue/gin-shop
  title: gin-shop  API
  version: "1.0"
paths:
  /:
    delete:
      description: delete user
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
    get:
      description: material group list
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
    post:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
    put:
      description: update material group
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /:id:
    delete:
      description: delete material group
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
    get:
      description: get role by ID
      parameters:
      - description: role ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /addOrSave:
    post:
      description: add product
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /admin/login:
    post:
      description: login
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /build:
    get:
      description: build menus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /captcha:
    get:
      description: get captcha
  /center:
    put:
      description: update user profile
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /info:
    get:
      description: get user info
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /info/:id:
    get:
      description: get product info
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /isFormatAttr/:id:
    post:
      description: generate product SKU
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /logout:
    delete:
      description: logout
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /menu:
    put:
      description: update role menus
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /onsale/:id:
    post:
      description: toggle product shelf status
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /save/:id:
    post:
      description: add product spec SKU
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /tree:
    get:
      description: menu tree
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /updateAvatar:
    post:
      description: upload user avatar
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /updatePass:
    post:
      description: change user password
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
  /upload:
    post:
      parameters:
      - description: Image File
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/app.Response'
      summary: Import Image
swagger: "2.0"
